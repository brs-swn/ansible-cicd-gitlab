---
# Configure GitLab
- name: Firewall Rules for HTTP
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
    offline: true
  with_items:
    - http
    - https

- name: GitLab Template Configs
  ansible.builtin.template:
    src: "templates/gitlab.rb.j2"
    dest: "/etc/gitlab/gitlab.rb"
    owner: "root"
    group: "root"
    mode: "0600"
  notify:
    - Restart postfix

