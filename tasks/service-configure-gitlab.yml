---
# Configure OpenProject
- name: GitLab Template Configs
  ansible.builtin.template:
    src: "templates/gitlab.rb.j2"
    dest: "/etc/gitlab/gitlab.rb"
    owner: "root"
    group: "root"
    mode: "0600"
  notify:
    - Restart postfix

